<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعي مثل 0xrushy</title>
<style>
/* Reset */
* {margin:0; padding:0; box-sizing:border-box;}
body {
  font-family: Arial, sans-serif;
  color: #fff;
  overflow-x: hidden;
  margin:0;
  padding:0;
}

/* فيديو الخلفية */
#background-video {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit: cover;
  z-index:-1;
}

/* القائمة الثابتة */
header {
  position: fixed;
  top:0;
  width:100%;
  background: rgba(0,0,0,0.7);
  display:flex;
  justify-content: space-between;
  align-items:center;
  padding:1rem 2rem;
  z-index:1000;
}
header h1 {color:#00ffff;}
header nav a {
  color:#fff;
  text-decoration:none;
  margin-left:1.5rem;
  transition: color 0.3s;
}
header nav a:hover {color:#00ffff;}

/* أقسام الموقع */
section {
  min-height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:2rem;
}

/* قسم البداية */
#hero {
  background: rgba(0,0,0,0.3);
}
#hero h2 {
  font-size:3rem;
  margin-bottom:1rem;
  color:#00ffff;
}
#hero p {font-size:1.2rem;}

/* المشاريع */
#projects {background: rgba(0,0,0,0.6);}
#projects h2 {margin-bottom:2rem; color:#00ffff;}
.project-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap:1.5rem;
}
.project {
  background: rgba(255,255,255,0.1);
  padding:1.5rem;
  border-radius:10px;
  opacity:0;
  transform: translateY(50px);
  transition: transform 0.5s, opacity 0.5s;
}
.project:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,255,255,0.2);
}

/* قسم التواصل */
#contact {background: rgba(0,0,0,0.5);}

/* Footer */
footer {
  text-align:center;
  padding:1rem;
  background: rgba(0,0,0,0.7);
  color:#888;
}

/* Smooth scroll */
html {scroll-behavior: smooth;}
</style>
</head>
<body>

<!-- خلفية الفيديو -->
<video autoplay muted loop id="background-video">
  <source src="YOUR_VIDEO_MP4_URL_HERE.mp4" type="video/mp4">
  متصفحك لا يدعم الفيديو.
</video>

<!-- القائمة الثابتة -->
<header>
  <h1>MySite</h1>
  <nav>
    <a href="#hero">الرئيسية</a>
    <a href="#projects">المشاريع</a>
    <a href="#contact">تواصل</a>
  </nav>
</header>

<!-- قسم البداية -->
<section id="hero">
  <div>
    <h2>مرحباً بك في موقعي</h2>
    <p>موقع شخصي عصري مع خلفية فيديو وتأثيرات عند التمرير.</p>
  </div>
</section>

<!-- قسم المشاريع -->
<section id="projects">
  <h2>مشاريعي</h2>
  <div class="project-grid">
    <div class="project">مشروع 1</div>
    <div class="project">مشروع 2</div>
    <div class="project">مشروع 3</div>
    <div class="project">مشروع 4</div>
  </div>
</section>

<!-- قسم التواصل -->
<section id="contact">
  <h2>تواصل معي</h2>
  <p>البريد الإلكتروني: example@example.com</p>
</section>

<!-- Footer -->
<footer>
  © 2025 MySite. جميع الحقوق محفوظة.
</footer>

<!-- JavaScript -->
<script>
// تأثير عند التمرير على المشاريع
const projects = document.querySelectorAll('.project');
window.addEventListener('scroll', () => {
  projects.forEach(project => {
    const rect = project.getBoundingClientRect();
    if(rect.top < window.innerHeight - 100){
      project.style.opacity = 1;
      project.style.transform = "translateY(0)";
    } else {
      project.style.opacity = 0;
      project.style.transform = "translateY(50px)";
    }
  });
});
</script>

</body>
</html>
